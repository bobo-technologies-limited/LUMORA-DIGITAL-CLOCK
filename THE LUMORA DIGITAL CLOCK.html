<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>LUMORA — Notion Digital Clock | Bobo Technologies Limited</title>

<style>
    :root {
        --bg: #0b1020;
        --bg2: #151d34;
        --text: #ffffff;
        --muted: #d8dbe5;
        --soft: #aeb4c3;
        --glass: rgba(255,255,255,.09);
        --border: rgba(255,255,255,.18);
        --button: rgba(255,255,255,.10);
        --button-hover: rgba(255,255,255,.18);
        --purple: #7867ff;
        --pink: #ff6fae;
        --cyan: #42d9ff;
    }

    @media (prefers-color-scheme: light) {
        :root {
            --bg: #eef1f7;
            --bg2: #dce3ef;
            --text: #111827;
            --muted: #374151;
            --soft: #596273;
            --glass: rgba(255,255,255,.72);
            --border: rgba(17,24,39,.15);
            --button: rgba(255,255,255,.65);
            --button-hover: rgba(255,255,255,.9);
            --purple: #5d50d8;
            --pink: #c94f86;
            --cyan: #087f9b;
        }
    }

    html[data-theme="dark"] {
        --bg: #0b1020;
        --bg2: #151d34;
        --text: #ffffff;
        --muted: #d8dbe5;
        --soft: #aeb4c3;
        --glass: rgba(255,255,255,.09);
        --border: rgba(255,255,255,.18);
        --button: rgba(255,255,255,.10);
        --button-hover: rgba(255,255,255,.18);
    }

    html[data-theme="light"] {
        --bg: #eef1f7;
        --bg2: #dce3ef;
        --text: #111827;
        --muted: #374151;
        --soft: #596273;
        --glass: rgba(255,255,255,.72);
        --border: rgba(17,24,39,.15);
        --button: rgba(255,255,255,.65);
        --button-hover: rgba(255,255,255,.9);
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        min-width: 0;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: clamp(6px, 2vw, 18px);

        font-family: Inter, "Segoe UI", system-ui, -apple-system,
                     BlinkMacSystemFont, sans-serif;

        color: var(--text);

        background:
            radial-gradient(circle at 15% 15%,
                rgba(120,103,255,.22),
                transparent 36%),
            radial-gradient(circle at 85% 85%,
                rgba(255,111,174,.18),
                transparent 36%),
            linear-gradient(135deg, var(--bg), var(--bg2));
    }

    .background {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: -1;
    }

    .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(55px);
        opacity: .28;
        animation: float 14s ease-in-out infinite alternate;
    }

    .orb.one {
        width: min(40vw, 280px);
        height: min(40vw, 280px);
        background: var(--purple);
        top: -90px;
        left: -70px;
    }

    .orb.two {
        width: min(35vw, 240px);
        height: min(35vw, 240px);
        background: var(--pink);
        right: -60px;
        bottom: -70px;
        animation-delay: -5s;
    }

    .orb.three {
        width: min(26vw, 180px);
        height: min(26vw, 180px);
        background: var(--cyan);
        right: 25%;
        top: 10%;
        opacity: .10;
        animation-delay: -8s;
    }

    @keyframes float {
        from { transform: translate3d(0,0,0) scale(1); }
        to { transform: translate3d(24px,-18px,0) scale(1.08); }
    }

    .clock-card {
        width: 100%;
        max-width: 720px;
        min-width: 0;
        padding: clamp(18px, 6vw, 52px) clamp(12px, 5vw, 45px);

        text-align: center;

        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: clamp(16px, 4vw, 32px);

        box-shadow:
            0 24px 65px rgba(0,0,0,.25),
            inset 0 1px 1px rgba(255,255,255,.08);

        -webkit-backdrop-filter: blur(20px);
        backdrop-filter: blur(20px);

        animation: appear .5s ease both;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(10px) scale(.985);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .label {
        margin-bottom: clamp(8px, 2.5vw, 18px);
        font-size: clamp(8px, 1.6vw, 12px);
        font-weight: 800;
        letter-spacing: clamp(1.5px, .7vw, 4px);
        text-transform: uppercase;
        color: var(--muted);
    }

    .clock {
        display: flex;
        align-items: baseline;
        justify-content: center;
        width: 100%;
        min-width: 0;

        font-size: clamp(2rem, 15vw, 8.5rem);
        font-weight: 750;
        line-height: .95;
        letter-spacing: clamp(-4px, -.8vw, -1px);

        white-space: nowrap;
        color: var(--text);
        text-shadow: 0 8px 28px rgba(0,0,0,.20);
    }

    .colon {
        margin: 0 clamp(2px, 1vw, 8px);
        opacity: .7;
        animation: blink 1s steps(1,end) infinite;
    }

    @keyframes blink {
        0%, 45% { opacity: .75; }
        50%, 100% { opacity: .25; }
    }

    .ampm {
        margin-left: clamp(4px, 1.8vw, 15px);
        margin-bottom: clamp(2px, 1.4vw, 13px);
        font-size: clamp(9px, 2vw, 14px);
        font-weight: 800;
        letter-spacing: clamp(1px, .3vw, 2px);
        color: var(--muted);
    }

    .date {
        margin-top: clamp(10px, 3vw, 24px);
        font-size: clamp(11px, 2.4vw, 17px);
        font-weight: 550;
        line-height: 1.35;
        color: var(--muted);
        overflow-wrap: anywhere;
    }

    .divider {
        width: clamp(30px, 9vw, 60px);
        height: 1px;
        margin: clamp(12px, 3.5vw, 28px) auto;
        background: var(--border);
    }

    .controls {
        display: flex;
        justify-content: center;
    }

    .format-button {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--button);
        color: var(--muted);

        padding: clamp(6px, 1.5vw, 9px)
                 clamp(10px, 2.5vw, 15px);

        border-radius: 999px;
        font: inherit;
        font-size: clamp(8px, 1.5vw, 11px);
        font-weight: 800;
        letter-spacing: clamp(.8px, .3vw, 1.5px);
        cursor: pointer;
    }

    .format-button:hover {
        background: var(--button-hover);
    }

    .format-button:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
    }

    .signature {
        margin-top: clamp(12px, 3.5vw, 28px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
    }

    .signature-line {
        width: clamp(18px, 4vw, 28px);
        height: 1px;
        background: var(--border);
    }

    .signature-text {
        max-width: 100%;
        font-size: clamp(6px, 1.35vw, 10px);
        font-weight: 700;
        letter-spacing: clamp(.7px, .35vw, 2px);
        line-height: 1.3;
        text-transform: uppercase;
        color: var(--soft);
        user-select: none;
    }

    .signature-brand {
        font-size: clamp(6px, 1.2vw, 9px);
        letter-spacing: clamp(.6px, .3vw, 1.5px);
        color: var(--soft);
        opacity: .75;
        user-select: none;
    }

    .no-js-message {
        display: none;
    }

    /* Very narrow Notion columns */
    @media (max-width: 280px) {
        body {
            padding: 4px;
        }

        .clock-card {
            padding: 12px 8px;
            border-radius: 14px;
        }

        .label,
        .divider,
        .signature-line,
        .signature-brand {
            display: none;
        }

        .date {
            margin-top: 7px;
            font-size: 9px;
        }

        .signature {
            margin-top: 7px;
        }

        .signature-text {
            font-size: 5px;
            letter-spacing: .6px;
        }
    }

    /* Very short horizontal embeds */
    @media (max-height: 230px) {
        body {
            padding: 4px;
        }

        .clock-card {
            padding: 8px 12px;
        }

        .label,
        .divider,
        .signature {
            display: none;
        }

        .date {
            margin-top: 6px;
            font-size: 10px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .orb,
        .clock-card,
        .colon {
            animation: none !important;
        }

        .orb {
            display: none;
        }

        .clock-card {
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
        }
    }
</style>
</head>

<body>

<div class="background" aria-hidden="true">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
</div>

<main class="clock-card" aria-label="LUMORA digital clock">

    <div class="label">Current Time</div>

    <div class="clock" aria-live="polite" aria-atomic="true">
        <span id="hours">--</span>
        <span class="colon">:</span>
        <span id="minutes">--</span>
        <span class="colon">:</span>
        <span id="seconds">--</span>
        <span class="ampm" id="ampm">--</span>
    </div>

    <div class="date" id="date">Loading time…</div>

    <noscript>
        <div class="no-js-message">
            LUMORA — JavaScript is required for the live clock.
        </div>
    </noscript>

    <div class="divider"></div>

    <div class="controls">
        <button
            type="button"
            class="format-button"
            id="formatButton"
            aria-label="Switch to 24-hour format"
        >
            12-HOUR
        </button>
    </div>

    <div class="signature">
        <div class="signature-line"></div>
        <div class="signature-text">
            Made By Bobo Technologies Limited
        </div>
        <div class="signature-brand">
            BOBO TECHNOLOGIES
        </div>
    </div>

</main>

<script>
/*
===============================================================
LUMORA CLOCK ENGINE
Made By Bobo Technologies Limited
© Bobo Technologies Limited
===============================================================
*/

(function () {
    "use strict";

    const BOBO_SIGNATURE = "Made By Bobo Technologies Limited";

    const hours = document.getElementById("hours");
    const minutes = document.getElementById("minutes");
    const seconds = document.getElementById("seconds");
    const ampm = document.getElementById("ampm");
    const date = document.getElementById("date");
    const button = document.getElementById("formatButton");

    let is24Hour = false;

    function pad(value) {
        return String(value).padStart(2, "0");
    }

    function updateClock() {
        const now = new Date();
        let h = now.getHours();

        if (is24Hour) {
            hours.textContent = pad(h);
            ampm.textContent = "";
            ampm.style.display = "none";
        } else {
            const period = h >= 12 ? "PM" : "AM";
            h = h % 12 || 12;

            hours.textContent = pad(h);
            ampm.textContent = period;
            ampm.style.display = "inline";
        }

        minutes.textContent = pad(now.getMinutes());
        seconds.textContent = pad(now.getSeconds());

        date.textContent = new Intl.DateTimeFormat(undefined, {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        }).format(now);
    }

    function toggleFormat() {
        is24Hour = !is24Hour;

        button.textContent = is24Hour ? "24-HOUR" : "12-HOUR";
        button.setAttribute(
            "aria-label",
            is24Hour
                ? "Switch to 12-hour format"
                : "Switch to 24-hour format"
        );

        updateClock();
    }

    button.addEventListener("click", toggleFormat);

    /* Render immediately. */
    updateClock();

    /* Keep seconds aligned with the real clock. */
    function schedule() {
        const delay = 1000 - (Date.now() % 1000) + 20;

        window.setTimeout(function () {
            updateClock();
            schedule();
        }, delay);
    }

    schedule();

    /* Recover immediately when a Notion iframe becomes visible. */
    document.addEventListener("visibilitychange", function () {
        if (!document.hidden) {
            updateClock();
        }
    });

})();
</script>

</body>
</html>
